[package]
name = "serial_test"
version = "4.0.1"
edition = "2018"
rust-version.workspace = true
description = "Allows for the creation of serialised Rust tests"
readme = "README.md"
repository = "https://github.com/palfrey/serial_test/"
license = "MIT"
keywords = ["parallel", "sequential", "testing"]
categories = ["development-tools::testing"]

# docs.rs-specific configuration
[package.metadata.docs.rs]
all-features = true
# defines the configuration attribute `docsrs`
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-all-features]
skip_optional_dependencies = true
denylist = ["docsrs"]
always_include_features = ["test_logging"]

[dependencies]
document-features = { version = ">=0.2.0, <0.3", optional = true }
env_logger = { version = ">=0.6.1, <0.12", default-features = false, optional = true }
fslock = { version = ">=0.2.0, <0.3", default-features = false, features = ["std"], optional = true }
futures-executor = { version = ">=0.3.0, <0.4", default-features = false, features = ["std"], optional = true }
futures-util = { version = ">=0.3.0, <0.4", default-features = false, features = ["std"], optional = true }
log = { version = ">=0.4.4, <0.5", optional = true }
once_cell = { version = ">=1.19.0, <2", default-features = false, features = ["std"] }
parking_lot = { version = ">=0.12.0, <0.13", default-features = false }
serial_test_derive = { path = "../serial_test_derive", version = "~4.0.1" }

[dev-dependencies]
itertools = { version = ">=0.4.0, <0.16", default-features = false, features = ["use_std"] }

[features]
default = ["async", "logging"]

## Switches on debug logging
logging = ["dep:log"]

## Enables async features using `futures`
async = ["dep:futures-executor", "dep:futures-util", "serial_test_derive/async"]

## The file_locks feature unlocks the `file_serial`/`file_parallel` macros
file_locks = ["dep:fslock"]

#! ### Internal-only features

## Switches on debug with `env_logger`. Generally only needed by internal `serial_test` work.
test_logging = ["dep:env_logger", "logging", "serial_test_derive/test_logging"]

docsrs = ["dep:document-features"]

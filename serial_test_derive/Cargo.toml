[package]
name = "serial_test_derive"
version = "4.0.1"
edition = "2018"
rust-version.workspace = true
description = "Helper crate for serial_test"
readme = "README.md"
repository = "https://github.com/palfrey/serial_test/"
license = "MIT"
categories = ["development-tools::testing"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { version = ">=1.0.60, <2", default-features = false, features = ["proc-macro"] }  # Because of https://github.com/dtolnay/proc-macro2/issues/356
quote = { version = ">=1.0.0, <2", default-features = false }
syn = { version = ">=3.0.0, <4", default-features = false, features = ["clone-impls", "full", "parsing", "printing"] }

[dev-dependencies]
env_logger = { version = ">=0.6.1, <0.12", default-features = false }
prettyplease = { version = ">=0.3.0, <0.4", default-features = false }

[features]
default = []
async = []
file_locks = []
test_logging = []
